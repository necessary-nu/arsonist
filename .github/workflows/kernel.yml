name: Kernel

# Hosts pull ghcr.io/necessary-nu/arsonist-kernel:latest and roll each slot
# onto a new push at its next boot, so this only runs for kernel changes.
on:
  push:
    branches: [main]
    paths: ["kernel/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: kernel
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/necessary-nu/arsonist-kernel:latest
            ghcr.io/necessary-nu/arsonist-kernel:${{ github.sha }}

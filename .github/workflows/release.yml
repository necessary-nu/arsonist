name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace
      - run: cargo build --workspace --release --target x86_64-unknown-linux-musl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bin in arsonist bao-ssh-agent; do
            cp "target/x86_64-unknown-linux-musl/release/$bin" "$bin-x86_64-linux"
            sha256sum "$bin-x86_64-linux" > "$bin-x86_64-linux.sha256"
          done
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            arsonist-x86_64-linux arsonist-x86_64-linux.sha256 \
            bao-ssh-agent-x86_64-linux bao-ssh-agent-x86_64-linux.sha256

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-unknown-linux-musl/release/arsonist arsonist-x86_64-linux
          sha256sum arsonist-x86_64-linux > arsonist-x86_64-linux.sha256
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            arsonist-x86_64-linux arsonist-x86_64-linux.sha256

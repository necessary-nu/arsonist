[package]
name = "bao-ssh-agent"
version = "0.1.0"
edition = "2024"
description = "An ssh agent whose one key stays in OpenBao's transit engine"
license = "EUPL-1.2"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-agent-lib = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
signature = "2"
